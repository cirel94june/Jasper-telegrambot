# fly.toml app configuration file generated for jasper-telegrambot on 2026-07-30T05:59:31Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'jasper-telegrambot'
primary_region = 'ewr'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
